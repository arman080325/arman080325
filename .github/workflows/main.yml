name: Generate contribution graphs

on:
  schedule:
    - cron: "0 */12 * * *"     # Runs automatically every 12 hours
  workflow_dispatch:           # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The "breaker" (red snake) eats the "builder's" commits (blueprint-blue dots).
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/blueprint-snake.svg?color_snake=#ff6b5e&color_dots=#1a3f80,#2a5aa6,#5d8fd8,#a9c8f5,#eaf2ff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw field measurements (live stats)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools brotli
          python scripts/build_blueprint_stats.py --user "${{ github.repository_owner }}" --out dist

      # A dedicated branch, so no other workflow can overwrite these images.
      - name: Deploy to output-blueprint branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-blueprint
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

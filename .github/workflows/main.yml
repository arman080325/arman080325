name: Generate contribution graphs

on:
  schedule:
    - cron: "0 */12 * * *"     # Runs automatically every 12 hours
  workflow_dispatch:           # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/secure-snake.svg?color_snake=#6d4dff&color_dots=#ebedf0,#c6f0dd,#86dfb6,#3cc98c,#139e66
            dist/secure-snake-dark.svg?palette=github-dark&color_snake=#8b7bff&color_dots=#161a26,#173a33,#1f6b55,#2aa57a,#34d399

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw live panels (git log, coverage, numbers, languages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools brotli
          python scripts/build_secure_stats.py --user "${{ github.repository_owner }}" --out dist

      # A dedicated branch, so no other workflow can overwrite these images.
      - name: Deploy to output-secure-stack branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-secure-stack
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

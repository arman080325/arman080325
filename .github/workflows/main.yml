name: Generate contribution graphs

on:
  schedule:
    - cron: "0 */12 * * *"     # Runs automatically every 12 hours
  workflow_dispatch:           # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The security line's red train runs over the contribution grid.
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/metro-snake.svg?color_snake=#e0322b&color_dots=#eef0f3,#bfe6cf,#7fd3a4,#2fb872,#0d9a55
            dist/metro-snake-dark.svg?color_snake=#ff5a52&color_dots=#1a2029,#14432b,#1c7045,#27a862,#2ecc7a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw live boards (stats)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools brotli
          python scripts/build_metro_stats.py --user "${{ github.repository_owner }}" --out dist

      # A dedicated branch, so no other workflow can overwrite these images.
      - name: Deploy to output-metro branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-metro
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

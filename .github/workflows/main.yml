name: Generate contribution graphs

on:
  schedule:
    - cron: "0 */12 * * *"     # Runs automatically every 12 hours
  workflow_dispatch:           # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6d4dff&color_dots=#ebedf0,#d9d2ff,#b3a6ff,#8b7bff,#6d4dff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8b7bff&color_dots=#161b22,#2e2860,#4b3fa8,#6d5ef0,#8b7bff

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D graphs
        run: cp profile-3d-contrib/*.svg dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats tiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools brotli
          python scripts/build_bento_stats.py --user "${{ github.repository_owner }}" --out dist

      # A dedicated branch, so no other workflow can overwrite these images.
      - name: Deploy to output-bento branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-bento
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

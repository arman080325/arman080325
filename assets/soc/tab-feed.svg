<svg xmlns="http://www.w3.org/2000/svg" width="147" height="38" viewBox="0 0 147 38" role="img" aria-label="03 Live Feed"><title>03 Live Feed</title><style>@font-face{font-family:F4;src:url(data:font/woff2;base64,)}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.fi{opacity:0;animation:fi .6s ease-out var(--d,0s) forwards}@keyframes fi{to{opacity:1}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}@keyframes grow{from{transform:scaleX(0)}}.rise{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}@keyframes rise{from{transform:scaleY(0)}}.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--t,1.6s) cubic-bezier(.4,0,.2,1) var(--d,0s) forwards}@keyframes dr{to{stroke-dashoffset:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out var(--d,0s) infinite}@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(3);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fi{opacity:1!important}.dr{stroke-dashoffset:0!important}.ping{opacity:0!important}}</style><rect x="0.8" y="0.8" width="145.5" height="36.5" rx="8" fill="#0d141b" stroke="#1d2a36" stroke-width="1.5"/><text x="14.0" y="24.0" font-family="F4" font-size="12" fill="#2dd4bf" letter-spacing="1">03</text><text x="40.0" y="24.0" font-family="F4" font-size="12" fill="#dbe4ee" letter-spacing="1.4">LIVE FEED</text><circle cx="131.0" cy="19.0" r="3" fill="#2dd4bf" class="pulse"/></svg>
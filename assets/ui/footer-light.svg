<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Build it. Break it. Harden it. Ship it."><title>Build it. Break it. Harden it. Ship it.</title><style>@font-face{font-family:F1;src:url(data:font/woff2;base64,)}@font-face{font-family:F2;src:url(data:font/woff2;base64,)}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.cur{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}.run{animation:rn 7s ease-in-out infinite alternate}@keyframes rn{from{transform:translateX(-300px)}to{transform:translateX(300px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#1a7f37" stop-opacity="0"/><stop offset=".5" stop-color="#1a7f37"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></linearGradient></defs><line x1="200" y1="20" x2="800" y2="20" stroke="#d0d7de"/><g class="run"><rect x="440" y="19" width="120" height="2" fill="url(#ln)"/></g><g class="up"><text x="317.4" y="66" font-family="F1" font-size="22" fill="#1f2328" >Build it. Break it. Harden it. Ship it.</text><text x="410.0" y="98" font-family="F2" font-size="14" fill="#1a7f37" >arman@kali</text><text x="494.0" y="98" font-family="F2" font-size="14" fill="#59636e" >:~$ logout</text><rect class="cur" x="584" y="87" width="7" height="14" fill="#1a7f37"/></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300" role="img" aria-label="SiteShield: Grades a website's TLS, headers, cookies and DNS hygiene A to F and alerts when a grade drops. Pipeline: BUILD, HARDEN, in progress. Hardened with passive checks only, JWT + bcrypt, per-user isolation. Stack: React · FastAPI · Celery."><title>SiteShield: Grades a website's TLS, headers, cookies and DNS hygiene A to F and alerts when a grade drops. Pipeline: BUILD, HARDEN, in progress. Hardened with passive checks only, JWT + bcrypt, per-user isolation. Stack: React · FastAPI · Celery.</title><style>@font-face{font-family:F0;src:url(data:font/woff2;base64,)}@font-face{font-family:F1;src:url(data:font/woff2;base64,)}@font-face{font-family:F2;src:url(data:font/woff2;base64,)}@font-face{font-family:F3;src:url(data:font/woff2;base64,)}@font-face{font-family:F4;src:url(data:font/woff2;base64,)}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.fi{opacity:0;animation:fi .6s ease-out var(--d,0s) forwards}@keyframes fi{to{opacity:1}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}@keyframes grow{from{transform:scaleX(0)}}.rise{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}@keyframes rise{from{transform:scaleY(0)}}.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--t,1.4s) cubic-bezier(.4,0,.2,1) var(--d,0s) forwards}@keyframes dr{to{stroke-dashoffset:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out var(--d,0s) infinite}@keyframes ping{from{transform:scale(.5);opacity:.8}to{transform:scale(2.8);opacity:0}}.go{animation:go 1.8s ease-in-out infinite}@keyframes go{50%{transform:translate(2px,-2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fi{opacity:1!important}.dr{stroke-dashoffset:0!important}.ping{opacity:0!important}}</style><defs><pattern id="g1" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#252b3b"/></pattern><radialGradient id="g1r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><clipPath id="g1c"><rect width="490" height="300" rx="14"/></clipPath></defs><g clip-path="url(#g1c)"><rect width="490" height="300" fill="#10131c"/><rect width="490" height="300" fill="url(#g1)" opacity=".6"/><rect width="490" height="300" fill="url(#g1r)"/></g><rect x="0.8" y="0.8" width="488.5" height="298.5" rx="14" fill="none" stroke="#252b3b" stroke-width="1.5"/><text x="24.0" y="34.0" font-family="F3" font-size="10.5" fill="#767d93" xml:space="preserve">arman080325/SiteShield-Web</text><rect x="378.4" y="18.0" width="87.6" height="24.0" rx="12" fill="#161a26" stroke="#fbbf24" stroke-width="1.2"/><circle cx="391.4" cy="30.0" r="3.8" fill="#fbbf24" class="pulse"/><text x="401.4" y="34.0" font-family="F4" font-size="10" fill="#fbbf24" xml:space="preserve" letter-spacing="1.2">BUILDING</text><text x="24.0" y="74.0" font-family="F0" font-size="23" fill="#e6e8f0" xml:space="preserve" letter-spacing="-0.4">SiteShield</text><text x="24.0" y="98.0" font-family="F1" font-size="13" fill="#b4b9c9" xml:space="preserve">Grades a website's TLS, headers, cookies and DNS hygiene A to F and</text><text x="24.0" y="116.0" font-family="F1" font-size="13" fill="#b4b9c9" xml:space="preserve">alerts when a grade drops.</text><path d="M40,160 H448" stroke="#252b3b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="grow" style="--d:.2s"><path d="M40,160 H176" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fi" style="--d:0.30s"><circle cx="40.0" cy="160.0" r="11" fill="#10131c" stroke="#34d399" stroke-width="2"/>
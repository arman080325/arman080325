<svg xmlns="http://www.w3.org/2000/svg" width="171" height="40" viewBox="0 0 171 40" role="img" aria-label="Stack under test"><title>Stack under test</title><style>@font-face{font-family:F2;src:url(data:font/woff2;base64,)}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.fi{opacity:0;animation:fi .6s ease-out var(--d,0s) forwards}@keyframes fi{to{opacity:1}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}@keyframes grow{from{transform:scaleX(0)}}.rise{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}@keyframes rise{from{transform:scaleY(0)}}.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--t,1.4s) cubic-bezier(.4,0,.2,1) var(--d,0s) forwards}@keyframes dr{to{stroke-dashoffset:0}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out var(--d,0s) infinite}@keyframes ping{from{transform:scale(.5);opacity:.8}to{transform:scale(2.8);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fi{opacity:1!important}.dr{stroke-dashoffset:0!important}.ping{opacity:0!important}}</style><rect x="0.8" y="0.8" width="169.5" height="38.5" rx="20" fill="#10131c" stroke="#252b3b" stroke-width="1.5"/><circle cx="20.0" cy="20.0" r="5" fill="#8b7bff"/><circle cx="27.0" cy="20.0" r="5" fill="#34d399" opacity="0.9"/><text x="42.0" y="25.0" font-family="F2" font-size="14" fill="#e6e8f0" xml:space="preserve">Stack under test</text></svg>
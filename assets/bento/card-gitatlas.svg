<svg xmlns="http://www.w3.org/2000/svg" width="490" height="360" viewBox="0 0 490 360" role="img" aria-label="GitAtlas — Dev tool"><title>GitAtlas — Dev tool</title><style>@font-face{font-family:F0;src:url(data:font/woff2;base64,)}@font-face{font-family:F3;src:url(data:font/woff2;base64,)}@font-face{font-family:F4;src:url(data:font/woff2;base64,)}@font-face{font-family:F5;src:url(data:font/woff2;base64,)}@font-face{font-family:F6;src:url(data:font/woff2;base64,)}svg{--page:#0d1117;--tile:#111118;--tile2:#17171f;--border:#262633;--fg:#f5f5f7;--soft:#d6d6de;--muted:#9b9bab;--violet:#8b7bff;--pink:#ff6b9a;--cyan:#2fd6f0;--amber:#ffb547;--green:#34d399;--glow:.55}@media (prefers-color-scheme:light){svg{--page:#ffffff;--tile:#ffffff;--tile2:#f6f6f9;--border:#e5e5ee;--fg:#111118;--soft:#2a2a35;--muted:#5f5f70;--violet:#6d4dff;--pink:#e0306b;--cyan:#0aa3c2;--amber:#d48600;--green:#0e9e6c;--glow:.28}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}@keyframes ring{from{transform:scale(.6);opacity:.7}to{transform:scale(2.6);opacity:0}}.dl4{animation-delay:-0.0s}.dl5{animation-delay:-0.4s}.dl6{animation-delay:-0.8s}.dl7{animation-delay:-1.2s}.dl8{animation-delay:-1.6s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="tg1" cx="1" cy="0" r="1"><stop offset="0" style="stop-color:var(--amber);stop-opacity:var(--glow)"/><stop offset="1" style="stop-color:var(--amber);stop-opacity:0"/></radialGradient><clipPath id="tc2"><rect x="1" y="1" width="488" height="358" rx="22"/></clipPath><clipPath id="well3"><rect x="14" y="14" width="462" height="176" rx="14"/></clipPath></defs><g clip-path="url(#tc2)"><rect x="0.0" y="0.0" width="490.0" height="360.0" rx="0" style="fill:var(--tile);" /><rect x="0" y="0" width="490" height="360" style="fill:url(#tg1)" opacity=".45"/></g><rect x="1.0" y="1.0" width="488.0" height="
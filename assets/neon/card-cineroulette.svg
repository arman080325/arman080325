<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="CINEROULETTE — Movie Picker"><title>CINEROULETTE — Movie Picker</title><style>@font-face{font-family:Orb;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:Mono;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:Pix;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:Raj;src:url(data:font/woff2;base64,) format('woff2');}.trace{stroke-dasharray:120 1300;animation:tr 4s linear infinite}@keyframes tr{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-1420}}.pulse{animation:pu 1.2s ease-in-out infinite}@keyframes pu{50%{opacity:.2}}.arrow{animation:ar 1.4s ease-in-out infinite}@keyframes ar{50%{transform:translateX(6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0620"/><stop offset="1" stop-color="#07020f"/></linearGradient></defs><path d="M14,2 H466 L478,14 V236 L466,248 H14 L2,236 V14 Z" fill="url(#bgc)" stroke="#ff2a6d" stroke-opacity=".45" stroke-width="2"/><path class="trace" d="M14,2 H466 L478,14 V236 L466,248 H14 L2,236 V14 Z" fill="none" stroke="#ff2a6d" stroke-width="3"/><text x="22" y="34" font-family="Pix" font-size="10" fill="#ff2a6d" >PRJ-06</text><circle cx="390.0" cy="30" r="5" fill="#b8ff3c" class="pulse"/><text x="402.0" y="34" font-family="Pix" font-size="9" fill="#b8ff3c" >ONLINE</text><text x="22" y="72" font-family="Orb" font-size="25" fill="#f4f1ff" >CINEROULETTE</text><text x="22" y="96" font-family="Raj" font-size="17" fill="#ff2a6d" letter-spacing="1.5">MOVIE PICKER</text><text x="22" y="124" font-family="Mono" font-size="14.5" fill="#cfc8ea" >Pick a mood, spin the reel, get one explained pick.</text><text x="22" y="144" font-family="Mono" font-size="14.5" fill="#cfc8ea" >Weighted scoring normalized per language and region.</text><rect x="22" y="190" width